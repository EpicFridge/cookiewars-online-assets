<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cookiewars Online</title>
<style>
  :root { --blue:#7fd0ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#a8dcff; font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif; color:#fff; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #tags { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .tag { position:absolute; left:0; top:0; display:none; text-align:center; will-change:transform; }
  .tag .name { display:inline-block; font-size:13px; font-weight:bold; padding:1px 7px; border-radius:9px; background:rgba(0,0,0,.35); text-shadow:0 1px 2px #000; white-space:nowrap; }
  .tag .bubble { display:none; position:relative; max-width:210px; margin:0 auto 9px; padding:6px 10px; border-radius:12px; background:#fff; color:#222; font-size:14px; line-height:1.25; word-wrap:break-word; box-shadow:0 2px 6px rgba(0,0,0,.35); }
  .tag .bubble::after { content:""; position:absolute; left:50%; bottom:-7px; margin-left:-7px; border:7px solid transparent; border-bottom:0; border-top-color:#fff; }

  #lobby { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(255,200,230,.25); backdrop-filter:blur(4px); z-index:50; padding:10px; overflow:auto; }
  .card { width:min(380px,100%); background:rgba(60,30,50,.82); border:3px solid #ffb3d9; border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:12px; box-shadow:0 10px 40px rgba(0,0,0,.4); user-select:auto; -webkit-user-select:auto; }
  .card h1 { margin:0; text-align:center; font-size:26px; text-shadow:0 2px 0 #c2467f; }
  .card input, .card select { width:100%; font-size:17px; padding:10px 12px; border-radius:10px; border:2px solid #ffb3d9; background:#fff; color:#222; outline:none; font-family:inherit; }
  .previewBox { height:240px; border-radius:14px; background:radial-gradient(circle at 50% 80%, #ffe6f2, #d9f0ff); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  #preview { height:100%; aspect-ratio:1/1; }
  #playBtn { font-size:22px; font-weight:bold; padding:12px; border:0; border-radius:14px; background:linear-gradient(#ff8cc6,#e0509a); color:#fff; cursor:pointer; text-shadow:0 2px 0 rgba(0,0,0,.25); font-family:inherit; }
  #playBtn:disabled { filter:grayscale(.8) brightness(.8); cursor:default; }
  #lobbyStatus { min-height:20px; text-align:center; font-size:14px; color:#ffd; }

  #hud { position:fixed; inset:0; display:none; pointer-events:none; z-index:10; }
  #hud button, #hud input, #hud .click { pointer-events:auto; }
  #chat { position:absolute; left:10px; top:max(10px,env(safe-area-inset-top)); width:min(420px,60vw); }
  #chat.hidden { display:none; }
  #chatlog { max-height:210px; overflow-y:auto; padding:6px 8px; border-radius:8px; background:rgba(0,0,0,.35); font-size:15px; line-height:1.35; text-shadow:0 1px 2px #000; pointer-events:auto; user-select:text; -webkit-user-select:text; word-wrap:break-word; }
  #chatlog:empty { display:none; }
  #chatlog .sys { font-style:italic; color:#bbb; }
  #chatlog .pn { color:var(--blue); }
  #chatinput { display:none; width:100%; margin-top:5px; font-size:16px; padding:7px 10px; border-radius:8px; border:2px solid #fff; background:rgba(0,0,0,.65); color:#fff; outline:none; font-family:inherit; }
  #topright { position:absolute; right:10px; top:max(10px,env(safe-area-inset-top)); display:flex; align-items:center; gap:8px; }
  #ping { font-size:12px; text-shadow:0 1px 2px #000; opacity:.85; }
  .roundBtn { width:44px; height:44px; border-radius:50%; border:2px solid #fff; background:rgba(0,0,0,.45); color:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; font-family:inherit; touch-action:none; }
  .roundBtn.off { background:rgba(217, 52, 79, 0.85); }
  #options { display:none; position:absolute; right:0; top:52px; width:240px; padding:12px; border-radius:12px; background:rgba(40,20,35,.92); border:2px solid #ffb3d9; font-size:15px; pointer-events:auto; }
  #options label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:8px 0; }
  #options h3 { margin:0 0 4px; font-size:17px; }
  #options input[type=range] { width:100px; }
  #emotes { position:absolute; left:10px; bottom:max(10px,env(safe-area-inset-bottom)); font-size:15px; line-height:1.5; text-shadow:0 1px 3px #000, 0 0 4px #000; }
  #emotes.hidden { display:none; }
  #emotes div { cursor:pointer; pointer-events:auto; }
  #hint { position:absolute; right:10px; max-width:min(560px,55vw); bottom:max(10px,env(safe-area-inset-bottom)); font-size:14px; text-shadow:0 1px 3px #000, 0 0 4px #000; text-align:right; }

  #touchui { display:none; }
  body.touch #touchui { display:block; }
  body.touch #hint { display:none; }
  body.touch #emotes { bottom:190px; background:rgba(0,0,0,.55); border-radius:12px; padding:8px 12px; font-size:16px; }
  #joy { position:absolute; left:max(22px,env(safe-area-inset-left)); bottom:max(24px,env(safe-area-inset-bottom)); width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.6); pointer-events:auto; touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:rgba(255,255,255,.65); }
  #jumpBtn { position:absolute; right:max(22px,env(safe-area-inset-right)); bottom:max(30px,env(safe-area-inset-bottom)); width:84px; height:84px; font-size:16px; font-weight:bold; background:rgba(255,140,200,.55); pointer-events:auto; }
  #sideBtns { position:absolute; right:max(22px,env(safe-area-inset-right)); bottom:calc(max(30px,env(safe-area-inset-bottom)) + 100px); display:flex; flex-direction:column; gap:10px; }
  #sideBtns .roundBtn { pointer-events:auto; }

  .tag .name.owner { color:#ffd54a; }
  #admin { display:none; position:absolute; right:10px; top:64px; width:290px; height:min(70vh,560px); flex-direction:column; background:rgba(30,15,28,.92); border:2px solid #ffd54a; border-radius:12px; pointer-events:auto; font-size:14px; overflow:hidden; z-index:3; }
  #admin .ah { padding:8px 10px; font-weight:bold; background:rgba(255,213,74,.18); border-bottom:1px solid #ffd54a; display:flex; justify-content:space-between; align-items:center; }
  #admin .half { flex:1 1 0; min-height:0; display:flex; flex-direction:column; }
  #admin .half + .half { border-top:2px solid #ffd54a; }
  #admin .sh { padding:5px 10px; font-weight:bold; color:#ffd54a; }
  #admin .list { flex:1; overflow-y:auto; padding:0 6px 6px; }
  #admin .row { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:3px 4px; border-radius:6px; }
  #admin .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #admin .kick { flex:none; border:0; border-radius:6px; background:#d9344f; color:#fff; font-size:12px; font-weight:bold; padding:3px 9px; cursor:pointer; font-family:inherit; }
  #admin .mutebtn { flex:none; border:0; border-radius:6px; background:#e0509a; color:#fff; font-size:11px; padding:3px 6px; cursor:pointer; }
  #kickPopup { display:none; position:fixed; inset:0; z-index:120; background:rgba(0,0,0,.6); align-items:center; justify-content:center; }
  #kickPopup .box { background:rgba(60,30,50,.96); border:3px solid #ffb3d9; border-radius:16px; padding:22px 30px; text-align:center; font-size:22px; display:flex; flex-direction:column; gap:14px; }
  #disc { display:none; position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.7); align-items:center; justify-content:center; flex-direction:column; gap:14px; font-size:22px; text-align:center; padding:20px; }
  #disc button, #kickPopup button { font-size:18px; padding:8px 24px; border-radius:10px; border:0; background:#e0509a; color:#fff; cursor:pointer; font-family:inherit; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="tags"></div>

<div id="lobby">
  <div class="card">
    <h1>🍪 Cookiewars Online</h1>
    <input id="username" maxlength="24" placeholder="Username" autocomplete="off" spellcheck="false">
    <select id="charSelect"><option>Loading characters…</option></select>
    <div class="previewBox"><canvas id="preview" width="384" height="384"></canvas></div>
    <button id="playBtn" disabled>Play</button>
    <div id="lobbyStatus">Loading…</div>
  </div>
</div>

<div id="hud">
  <div id="chat">
    <div id="chatlog"></div>
    <input id="chatinput" maxlength="200" placeholder="Type a message (Enter = send, Esc = cancel)" autocomplete="off">
  </div>

  <div id="topright">
    <span id="ping"></span>
    <button class="roundBtn" id="btnMic" title="Toggle Mic (M)">🎙️</button>
    <button class="roundBtn" id="btnDeafen" title="Deafen Audio">🎧</button>
    <button class="roundBtn" id="gear" title="Options">⚙</button>
    <div id="options">
      <h3>Options</h3>
      <label>Mute Microphone <input type="checkbox" id="optMute"></label>
      <label>Deafen Audio <input type="checkbox" id="optDeafen"></label>
      <label>Chat bubbles <input type="checkbox" id="optBubbles"></label>
      <label>Name tags <input type="checkbox" id="optTags"></label>
      <label>Show chat <input type="checkbox" id="optChat"></label>
      <label>Camera speed <input type="range" id="optSens" min="0.3" max="2.5" step="0.1"></label>
    </div>
  </div>

  <div id="admin">
    <div class="ah">
      <span>PLAYERS: <span id="admTotal">--</span></span>
      <button class="mutebtn" id="btnMuteAll">Mute All</button>
    </div>
    <div class="half"><div class="sh" id="admNormalH"></div><div class="list" id="admNormal"></div></div>
    <div class="half"><div class="sh" id="admAltH"></div><div class="list" id="admAlt"></div></div>
  </div>

  <div id="emotes"></div>
  <div id="hint">M - Mic Mute | / - Chat | V - Camera | B - Lock Cursor | WASD - Move | SPACE - Jump</div>

  <div id="touchui">
    <div id="joy"><div id="knob"></div></div>
    <div id="sideBtns">
      <button class="roundBtn" id="btnRun">🏃</button>
      <button class="roundBtn" id="btnEmote">😀</button>
      <button class="roundBtn" id="btnChat">💬</button>
      <button class="roundBtn" id="btnCam">🎥</button>
    </div>
    <button class="roundBtn" id="jumpBtn">JUMP</button>
  </div>
</div>

<div id="kickPopup"><div class="box"><div>You've been kicked.</div><button onclick="location.reload()">OK</button></div></div>
<div id="disc"><div>Disconnected from the server.</div><button onclick="location.reload()">Reload</button></div>

<script>
(function () {
"use strict";
const $ = id => document.getElementById(id);
const lobbyStatus = $("lobbyStatus");
const status = t => { lobbyStatus.textContent = t; };

const TOUCH = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
if (TOUCH) document.body.classList.add("touch");
const CHAR_H = 2.0, TEX = 384, MOVE_SPEED = 6, RUN_SPEED = 10, JUMP_V = 9, GRAV = 25, RADIUS = 0.35, BODY_H = 1.8, WORLD = 57;

const EMOTES = [null,
  { label: "Attack 1", anim: "attack1", plays: 1 }, { label: "Attack 2", anim: "attack2", plays: 1 },
  { label: "Hurt", anim: "damage", plays: 1 }, { label: "Die", anim: "dead", plays: 1, hold: 2 },
  { label: "Dizzy", anim: "stun", plays: 2 }, { label: "Happy/Win", anim: "win", plays: 2 },
  { label: "Sad/Lose", anim: "lose", plays: 2 },
];

/* ------------------------------------------------------------ WebRTC Voice Audio Setup */
let audioCtx = null, localStream = null, isMuted = false, isDeafened = false, serverMuted = false;
const peerConnections = new Map();

async function initAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    localStream.getAudioTracks().forEach(t => t.enabled = !isMuted && !serverMuted);
  } catch (e) {
    console.warn("Microphone denied/unavailable:", e);
  }
}

function updateAudioPosition(pl) {
  const peer = peerConnections.get(pl.id);
  if (!peer || !peer.panner || !camera) return;
  if (peer.panner.positionX) {
    peer.panner.positionX.setValueAtTime(pl.pos.x, audioCtx.currentTime);
    peer.panner.positionY.setValueAtTime(pl.pos.y, audioCtx.currentTime);
    peer.panner.positionZ.setValueAtTime(pl.pos.z, audioCtx.currentTime);
  }
}

function toggleMute() {
  if (serverMuted) return;
  isMuted = !isMuted;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  $("btnMic").classList.toggle("off", isMuted);
  $("optMute").checked = isMuted;
}

function toggleDeafen() {
  isDeafened = !isDeafened;
  peerConnections.forEach(p => { if (p.gain) p.gain.gain.value = isDeafened ? 0 : 1; });
  $("btnDeafen").classList.toggle("off", isDeafened);
  $("optDeafen").checked = isDeafened;
}

$("btnMic").onclick = toggleMute;
$("btnDeafen").onclick = toggleDeafen;
$("optMute").onchange = toggleMute;
$("optDeafen").onchange = toggleDeafen;

function createPeerConnection(targetId, isInitiator) {
  if (peerConnections.has(targetId)) return peerConnections.get(targetId).pc;
  const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  const peer = { pc, panner: null, gain: null, audio: null };
  peerConnections.set(targetId, peer);

  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.onicecandidate = e => {
    if (e.candidate) send({ t: "rtc_candidate", to: targetId, data: e.candidate });
  };

  pc.ontrack = e => {
    if (!audioCtx) audioCtx = new AudioContext();
    const audio = new Audio();
    audio.srcObject = e.streams[0];
    audio.autoplay = true;

    const source = audioCtx.createMediaStreamSource(e.streams[0]);
    const panner = audioCtx.createPanner();
    panner.panningModel = "HRTF";
    panner.distanceModel = "inverse";
    panner.refDistance = 3;
    panner.maxDistance = 40;
    
    const gain = audioCtx.createGain();
    gain.gain.value = isDeafened ? 0 : 1;

    source.connect(panner);
    panner.connect(gain);
    gain.connect(audioCtx.destination);

    peer.panner = panner; peer.gain = gain; peer.audio = audio;
  };

  if (isInitiator) {
    pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
      send({ t: "rtc_offer", to: targetId, data: pc.localDescription });
    });
  }
  return pc;
}

/* ------------------------------------------------------------ Options & Controls */
function loadJSON(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (_) { return {}; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
const opts = Object.assign({ bubbles: true, tags: true, sens: 1 }, loadJSON("cwmp_opts"));
$("optChat").checked = true;
$("optChat").onchange = e => $("chat").classList.toggle("hidden", !e.target.checked);
$("optBubbles").checked = opts.bubbles; $("optTags").checked = opts.tags; $("optSens").value = opts.sens;
$("optBubbles").onchange = e => { opts.bubbles = e.target.checked; saveJSON("cwmp_opts", opts); };
$("optTags").onchange = e => { opts.tags = e.target.checked; saveJSON("cwmp_opts", opts); };
$("optSens").oninput = e => { opts.sens = parseFloat(e.target.value); saveJSON("cwmp_opts", opts); };
$("gear").onclick = () => { const o = $("options"); o.style.display = o.style.display === "block" ? "none" : "block"; };

function loadScript(urls) {
  return new Promise((res, rej) => {
    let i = 0;
    (function next() {
      if (i >= urls.length) return rej(new Error("Could not load script"));
      const s = document.createElement("script"); s.src = urls[i++];
      s.onload = () => res(); s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    })();
  });
}

let THREE_, renderer, scene, camera, spineCanvas, spineCtx, spineGL, spineRenderer, assetManager;
const colliders = [];
const players = new Map();
let me = null, myId = null, inGame = false, ws = null, leaving = false, isOwner = false;
let camMode = "third", yaw = 0, pitch = 0.35, camDist = 7;
const charCache = new Map();
let characters = [], selectedChar = null, previewPuppet = null, assetBase = "";

/* --- Interactive Ball Mesh & Physics --- */
let ballMesh = null;
const ball = { pos: null, vel: null, radius: 1.1, lastPush: 0 };

function initSpine() {
  spineCanvas = document.createElement("canvas"); spineCanvas.width = spineCanvas.height = TEX;
  spineCtx = new spine.webgl.ManagedWebGLRenderingContext(spineCanvas, { alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: true });
  spineGL = spineCtx.gl; spineRenderer = new spine.webgl.SceneRenderer(spineCanvas, spineCtx, false);
}
function amLoad(kind, path) {
  return new Promise((res, rej) => assetManager[kind](path, () => res(), (p, m) => rej(new Error(m || ("Failed " + p)))));
}
function applySkin(sk, sd) { try { if (sd.findSkin("skin01")) sk.setSkinByName("skin01"); } catch (e) {} sk.setToSetupPose(); }

function sampleBounds(sd, stateData, name, anims) {
  const sk = new spine.Skeleton(sd); applySkin(sk, sd);
  const st = new spine.AnimationState(stateData);
  const dur = Math.max(anims[name].duration, 0.01), N = 10, off = new spine.Vector2(), size = new spine.Vector2(), tmp = [];
  let b = null; st.setAnimation(0, name, true);
  for (let i = 0; i <= N; i++) {
    if (i > 0) st.update(dur / N);
    st.apply(sk); sk.updateWorldTransform(); sk.getBounds(off, size, tmp);
    if (!isFinite(off.x) || size.x <= 0) continue;
    const x0 = off.x, y0 = off.y, x1 = off.x + size.x, y1 = off.y + size.y;
    if (!b) b = { x0, y0, x1, y1 }; else { b.x0 = Math.min(b.x0, x0); b.y0 = Math.min(b.y0, y0); b.x1 = Math.max(b.x1, x1); b.y1 = Math.max(b.y1, y1); }
  }
  return b;
}

function loadCharacter(info) {
  if (charCache.has(info.name)) return charCache.get(info.name);
  const p = (async () => {
    const tryLoad = async prefix => {
      const base = prefix + "/Cookiewars/" + encodeURIComponent(info.name) + "/";
      const jsonPath = base + encodeURIComponent(info.json), atlasPath = base + encodeURIComponent(info.atlas);
      await Promise.all([amLoad("loadText", jsonPath), amLoad("loadTextureAtlas", atlasPath)]);
      return { atlas: assetManager.get(atlasPath), json: assetManager.get(jsonPath) };
    };
    let got; try { got = await tryLoad(assetBase); } catch (e) { got = await tryLoad(""); }
    const sd = new spine.SkeletonJson(new spine.AtlasAttachmentLoader(got.atlas)).readSkeletonData(got.json);
    const stateData = new spine.AnimationStateData(sd); stateData.defaultMix = 0.1;
    const anims = {}; sd.animations.forEach(a => anims[a.name] = a);
    const idleName = anims.idle ? "idle" : (sd.animations[0] && sd.animations[0].name);
    const idleB = sampleBounds(sd, stateData, idleName, anims) || { x0: -50, y0: 0, x1: 50, y1: 200 };
    let u = Object.assign({}, idleB);
    for (const n in anims) { const b = sampleBounds(sd, stateData, n, anims); if (b) { u.x0 = Math.min(u.x0, b.x0); u.y0 = Math.min(u.y0, b.y0); u.x1 = Math.max(u.x1, b.x1); u.y1 = Math.max(u.y1, b.y1); } }
    const ws_ = CHAR_H / Math.max(idleB.y1 - idleB.y0, 1), side = Math.max(u.x1 - u.x0, u.y1 - u.y0) * 1.08;
    return { name: info.name, sd, stateData, anims, side, cx: (u.x0 + u.x1) / 2, cy: (u.y0 + u.y1) / 2, planeSize: side * ws_, offX: ((u.x0 + u.x1)/2 - (idleB.x0 + idleB.x1)/2) * ws_, offY: ((u.y0 + u.y1)/2 - idleB.y0) * ws_ };
  })();
  charCache.set(info.name, p); return p;
}

class Puppet {
  constructor(ch) {
    this.ch = ch; this.sk = new spine.Skeleton(ch.sd); applySkin(this.sk, ch.sd);
    this.state = new spine.AnimationState(ch.stateData);
    this.running = false; this.moving = false; this.mode = "idle"; this.emote = null;
    const self = this; this.state.addListener({ complete: e => self.onComplete(e) });
    this.playIdle();
  }
  has(n) { return !!this.ch.anims[n]; }
  playIdle() { this.mode = "idle"; this.state.setAnimation(0, "idle", true); }
  playMove() { this.mode = "move"; this.state.setAnimation(0, this.has("move") ? "move" : "idle", true); }
  setMoving(m) { if (m === this.moving) return; this.moving = m; if (m) this.playMove(); else this.playIdle(); }
  playEmote(n) { const e = EMOTES[n]; if (!e || !this.has(e.anim)) return false; this.mode = "emote"; this.emote = e; this.state.setAnimation(0, e.anim, false); return true; }
  onComplete() { if (this.mode === "emote") { if (this.moving) this.playMove(); else this.playIdle(); } }
  update(dt) { this.state.timeScale = (this.mode === "move" && this.running) ? 1.3 : 1; this.state.update(dt); }
  renderTo(ctx2d) {
    const sk = this.sk, ch = this.ch, gl = spineGL;
    this.state.apply(sk); sk.updateWorldTransform();
    gl.viewport(0, 0, TEX, TEX); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    spineRenderer.camera.position.x = ch.cx; spineRenderer.camera.position.y = ch.cy;
    spineRenderer.camera.setViewport(ch.side, ch.side); spineRenderer.camera.update();
    spineRenderer.begin(); spineRenderer.drawSkeleton(sk, true); spineRenderer.end();
    ctx2d.clearRect(0, 0, TEX, TEX); ctx2d.drawImage(spineCanvas, 0, 0);
  }
}

/* ============================================================ World & House Setup */
function buildWorld() {
  const T = THREE;
  ball.pos = new T.Vector3(0, 2, 0);
  ball.vel = new T.Vector3(0, 0, 0);

  renderer = new T.WebGLRenderer({ canvas: $("game"), antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  scene = new T.Scene(); scene.background = new T.Color(0xa8dcff); scene.fog = new T.Fog(0xa8dcff, 55, 140);
  camera = new T.PerspectiveCamera(65, 1, 0.1, 400);
  scene.add(new T.HemisphereLight(0xffffff, 0xc9b08a, 0.9));
  const sun = new T.DirectionalLight(0xffffff, 0.55); sun.position.set(30, 50, 20); scene.add(sun);

  const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
  g.fillStyle = "#8fe08a"; g.fillRect(0, 0, 64, 64); g.fillStyle = "#7fd47a"; g.fillRect(0, 0, 32, 32); g.fillRect(32, 32, 32, 32);
  const gt = new T.CanvasTexture(c); gt.wrapS = gt.wrapT = T.RepeatWrapping; gt.repeat.set(60, 60);
  const ground = new T.Mesh(new T.PlaneGeometry(240, 240), new T.MeshLambertMaterial({ map: gt }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);

  function addBox(cx, cz, w, d, top, thick, color) {
    thick = Math.min(thick, top); color = color !== undefined ? color : 0xff9ec7;
    const geo = new T.BoxGeometry(w, thick, d);
    const m = new T.Mesh(geo, new T.MeshLambertMaterial({ color }));
    m.position.set(cx, top - thick / 2, cz); scene.add(m);
    colliders.push({ minX: cx - w / 2, maxX: cx + w / 2, minZ: cz - d / 2, maxZ: cz + d / 2, minY: top - thick, maxY: top });
  }

  // --- Map Platforms ---
  addBox(-6, 2, 4, 4, 1.1, 99); addBox(-10, -3, 4, 4, 2.2, 99); addBox(-10, -9, 4, 4, 3.3, 99);
  addBox(-4, -12, 4, 4, 4.4, 99); addBox(2, -12, 4, 4, 5.5, 99); addBox(9, -12, 8, 8, 6.6, 99, 0xffd1e8);

  // --- Interactive Log House Physics Object ---
  const houseX = -18, houseZ = -18;
  addBox(houseX - 3.5, houseZ, 0.6, 8, 4, 4, 0x8b5a2b);
  addBox(houseX + 3.5, houseZ, 0.6, 8, 4, 4, 0x8b5a2b);
  addBox(houseX, houseZ - 3.7, 7, 0.6, 4, 4, 0x8b5a2b);
  addBox(houseX - 2.2, houseZ + 3.7, 3, 0.6, 4, 4, 0x8b5a2b);
  addBox(houseX + 2.2, houseZ + 3.7, 3, 0.6, 4, 4, 0x8b5a2b);
  addBox(houseX, houseZ, 8, 8.4, 4.2, 0.4, 0x5a3d1e);

  // --- Interactive Physics Ball ---
  const ballGeo = new T.SphereGeometry(ball.radius, 32, 32);
  const ballMat = new T.MeshPhongMaterial({ color: 0xff3366, shininess: 80 });
  ballMesh = new T.Mesh(ballGeo, ballMat);
  ballMesh.position.copy(ball.pos);
  scene.add(ballMesh);

  window.addEventListener("resize", onResize); onResize();
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}

function groundHeightAt(x, y, z) {
  let h = 0;
  for (const b of colliders) {
    if (x > b.minX - 0.2 && x < b.maxX + 0.2 && z > b.minZ - 0.2 && z < b.maxZ + 0.2 && b.maxY <= y + 0.3 && b.maxY > h) h = b.maxY;
  }
  return h;
}

function updateBallPhysics(dt) {
  if (!ballMesh || !ball.pos || !ball.vel) return;
  ball.vel.y -= GRAV * dt * 0.5;
  ball.pos.addScaledVector(ball.vel, dt);
  ball.vel.x *= 0.98; ball.vel.z *= 0.98;

  const gh = groundHeightAt(ball.pos.x, ball.pos.y, ball.pos.z);
  if (ball.pos.y - ball.radius < gh) {
    ball.pos.y = gh + ball.radius;
    ball.vel.y = -ball.vel.y * 0.6;
  }

  if (me) {
    const d = me.pos.distanceTo(ball.pos);
    if (d < ball.radius + RADIUS) {
      const pushDir = new THREE.Vector3().subVectors(ball.pos, me.pos).normalize();
      pushDir.y = 0.3;
      ball.vel.addScaledVector(pushDir, 12);
      send({ t: "ball", x: ball.pos.x, y: ball.pos.y, z: ball.pos.z, vx: ball.vel.x, vy: ball.vel.y, vz: ball.vel.z });
    }
  }
  ballMesh.position.copy(ball.pos);
}

function makeTag(pl) {
  const el = document.createElement("div"); el.className = "tag";
  const b = document.createElement("div"); b.className = "bubble";
  const n = document.createElement("div"); n.className = "name"; n.textContent = pl.name;
  el.appendChild(b); el.appendChild(n); $("tags").appendChild(el);
  pl.tagEl = el; pl.bubbleEl = b; pl.nameEl = n;
}

function createPlayer(info, isMe) {
  const T = THREE;
  const pl = {
    id: info.id, name: info.name, char: info.char, isMe,
    pos: new T.Vector3(info.x, info.y, info.z), target: new T.Vector3(info.x, info.y, info.z),
    flip: 1, lastDir: null, speed: 0, moving: false, running: false, puppet: null, group: null,
    bubbleUntil: 0, vy: 0, grounded: false, coyote: 0, lastSend: 0, sentPos: new T.Vector3(1e9, 0, 0),
  };
  const sh = new T.Mesh(new T.CircleGeometry(0.5, 20), new T.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 }));
  sh.rotation.x = -Math.PI / 2; scene.add(sh); pl.shadow = sh;
  makeTag(pl);
  if (info.owner) pl.nameEl.classList.add("owner");
  players.set(pl.id, pl);
  const entry = characters.find(c => c.name === info.char);
  if (entry) loadCharacter(entry).then(ch => { if (players.get(pl.id) === pl) buildVisual(pl, ch); });

  if (!isMe) createPeerConnection(pl.id, true);
  return pl;
}

function buildVisual(pl, ch) {
  const T = THREE;
  pl.cv = document.createElement("canvas"); pl.cv.width = pl.cv.height = TEX; pl.ctx = pl.cv.getContext("2d");
  pl.tex = new T.CanvasTexture(pl.cv);
  const mat = new T.MeshBasicMaterial({ map: pl.tex, transparent: true, alphaTest: 0.05, side: T.DoubleSide });
  const mesh = new T.Mesh(new T.PlaneGeometry(ch.planeSize, ch.planeSize), mat);
  mesh.position.set(ch.offX, ch.offY, 0);
  pl.group = new T.Group(); pl.group.add(mesh); scene.add(pl.group);
  pl.puppet = new Puppet(ch); pl.charData = ch;
}

function removePlayer(id) {
  const pl = players.get(id); if (!pl) return;
  players.delete(id);
  if (pl.group) scene.remove(pl.group);
  scene.remove(pl.shadow); pl.tagEl.remove();
  if (peerConnections.has(id)) {
    peerConnections.get(id).pc.close();
    peerConnections.delete(id);
  }
}

const K = { up: false, down: false, left: false, right: false, jump: false, run: false };
let typing = false;

function updateLocal(dt) {
  const p = me.pos;
  let f = (K.up ? 1 : 0) - (K.down ? 1 : 0), r = (K.right ? 1 : 0) - (K.left ? 1 : 0);
  if (typing) { f = 0; r = 0; }
  const spd = K.run ? RUN_SPEED : MOVE_SPEED;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  const vx = (fx * f + rx * r) * spd, vz = (fz * f + rz * r) * spd;
  
  p.x += vx * dt; p.z += vz * dt;
  if (me.grounded && K.jump) me.vy = JUMP_V;
  me.vy -= GRAV * dt; p.y += me.vy * dt;
  const gh = groundHeightAt(p.x, p.y, p.z);
  if (p.y <= gh) { p.y = gh; me.vy = 0; me.grounded = true; } else me.grounded = false;

  me.moving = (f !== 0 || r !== 0);
  me.target.copy(p);
  if (performance.now() - me.lastSend > 66) {
    me.lastSend = performance.now();
    send({ t: "s", x: +p.x.toFixed(3), y: +p.y.toFixed(3), z: +p.z.toFixed(3) });
  }
}

function updateCamera() {
  const p = me.pos, cp = Math.cos(pitch);
  camera.position.set(p.x + Math.sin(yaw) * cp * camDist, Math.max(0.3, p.y + 1.1 + Math.sin(pitch) * camDist), p.z + Math.cos(yaw) * cp * camDist);
  camera.lookAt(p.x, p.y + 1.1, p.z);
  if (audioCtx) {
    audioCtx.listener.setPosition(p.x, p.y + 1.1, p.z);
    audioCtx.listener.setOrientation(-Math.sin(yaw), 0, -Math.cos(yaw), 0, 1, 0);
  }
}

function updateVisuals(dt) {
  for (const pl of players.values()) {
    if (pl.puppet) { pl.puppet.setMoving(pl.moving); pl.puppet.update(dt); }
    const gy = groundHeightAt(pl.pos.x, pl.pos.y, pl.pos.z);
    pl.shadow.position.set(pl.pos.x, gy + 0.03, pl.pos.z);
    if (pl.group) {
      pl.group.position.copy(pl.pos);
      pl.group.rotation.y = Math.atan2(camera.position.x - pl.pos.x, camera.position.z - pl.pos.z);
      pl.puppet.renderTo(pl.ctx); pl.tex.needsUpdate = true;
    }
    if (!pl.isMe) updateAudioPosition(pl);
  }
}

/* ------------------------------------------------------------ Chat & Input */
const chatEl = $("chat"), chatLog = $("chatlog"), chatInput = $("chatinput");
function addSys(t) { const d = document.createElement("div"); d.className = "sys"; d.textContent = t; chatLog.appendChild(d); }
function addChat(n, t) { const d = document.createElement("div"); d.innerHTML = `<span class="pn">[${n}]</span>: ${t}`; chatLog.appendChild(d); }

window.addEventListener("keydown", e => {
  if (e.key === "m" || e.key === "M") { toggleMute(); return; }
  if (typing) return;
  if (e.code === "KeyW") K.up = true; if (e.code === "KeyS") K.down = true;
  if (e.code === "KeyA") K.left = true; if (e.code === "KeyD") K.right = true;
  if (e.code === "Space") K.jump = true; if (e.shiftKey) K.run = true;
  if (e.key === "/") { e.preventDefault(); chatInput.style.display = "block"; chatInput.focus(); typing = true; }
});
window.addEventListener("keyup", e => {
  if (e.code === "KeyW") K.up = false; if (e.code === "KeyS") K.down = false;
  if (e.code === "KeyA") K.left = false; if (e.code === "KeyD") K.right = false;
  if (e.code === "Space") K.jump = false; if (!e.shiftKey) K.run = false;
});
chatInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    if (chatInput.value.trim()) send({ t: "chat", m: chatInput.value.trim() });
    chatInput.value = ""; chatInput.style.display = "none"; typing = false;
  }
});

$("btnMuteAll").onclick = () => send({ t: "mute_all", state: true });

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function handleMsg(m) {
  switch (m.t) {
    case "welcome":
      myId = m.id; isOwner = !!m.owner;
      me = createPlayer({ id: m.id, name: m.name, char: selectedChar.name, x: m.spawn.x, y: m.spawn.y, z: m.spawn.z, owner: isOwner }, true);
      for (const p of m.players) createPlayer(p, false);
      if (m.ball && ball.pos) { ball.pos.set(m.ball.x, m.ball.y, m.ball.z); ball.vel.set(m.ball.vx, m.ball.vy, m.ball.vz); }
      inGame = true; $("lobby").style.display = "none"; $("hud").style.display = "block";
      if (isOwner) $("admin").style.display = "flex";
      initAudio();
      break;
    case "join": if (m.p && !players.has(m.p.id)) createPlayer(m.p, false); break;
    case "leave": removePlayer(m.id); break;
    case "s": { const pl = players.get(m.id); if (pl) pl.pos.set(m.x, m.y, m.z); break; }
    case "ball": if (ball.pos) { ball.pos.set(m.x, m.y, m.z); ball.vel.set(m.vx, m.vy, m.vz); } break;
    case "chat": addChat(m.name, m.m); break;
    case "server_mute":
      serverMuted = m.state;
      if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !serverMuted && !isMuted);
      break;
    case "rtc_offer": {
      const pc = createPeerConnection(m.from, false);
      pc.setRemoteDescription(new RTCSessionDescription(m.data)).then(() => pc.createAnswer()).then(ans => pc.setLocalDescription(ans)).then(() => {
        send({ t: "rtc_answer", to: m.from, data: pc.localDescription });
      });
      break;
    }
    case "rtc_answer": {
      const peer = peerConnections.get(m.from);
      if (peer) peer.pc.setRemoteDescription(new RTCSessionDescription(m.data));
      break;
    }
    case "rtc_candidate": {
      const peer = peerConnections.get(m.from);
      if (peer) peer.pc.addIceCandidate(new RTCIceCandidate(m.data));
      break;
    }
  }
}

function startGame() {
  if (!selectedChar) return;
  const name = ($("username").value || "").trim().slice(0, 16);
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(proto + "://" + location.host + "/ws");
  ws.onopen = () => ws.send(JSON.stringify({ t: "join", name, char: selectedChar.name }));
  ws.onmessage = ev => handleMsg(JSON.parse(ev.data));
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (inGame) {
    updateLocal(dt);
    updateBallPhysics(dt);
    updateCamera();
    updateVisuals(dt);
  }
  if (renderer && scene && camera) renderer.render(scene, camera);
}

async function boot() {
  await loadScript(["https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js", "/vendor/three.min.js"]);
  await loadScript(["https://cdn.jsdelivr.net/gh/EsotericSoftware/spine-runtimes@3.7/spine-ts/build/spine-webgl.js", "/vendor/spine-webgl.js"]);
  THREE_ = window.THREE; initSpine();
  assetManager = new spine.webgl.AssetManager(spineCtx);
  buildWorld();
  requestAnimationFrame(frame);
  const r = await fetch("/api/characters");
  const data = await r.json();
  characters = data.characters;
  const sel = $("charSelect"); sel.innerHTML = "";
  for (const c of characters) { const o = document.createElement("option"); o.value = c.name; o.textContent = c.name; sel.appendChild(o); }
  sel.onchange = () => { selectedChar = characters.find(c => c.name === sel.value); };
  $("playBtn").onclick = startGame; $("playBtn").disabled = false;
  if (characters.length) { sel.value = characters[0].name; selectedChar = characters[0]; }
}
boot();
})();
</script>
